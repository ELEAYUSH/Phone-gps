
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone GPS Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f1f5f9;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      background: #1769e0;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .stop {
      background: #dc2626;
    }

    .value {
      font-weight: bold;
      font-size: 18px;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h2>Phone GPS Tracker</h2>

  <div class="card">
    <button onclick="startGPS()">Start GPS</button>
    <button class="stop" onclick="stopGPS()">Stop GPS</button>
    <p id="status">Status: Ready</p>
  </div>

  <div class="card">
    <p>Latitude: <span class="value" id="lat">--</span></p>
    <p>Longitude: <span class="value" id="lon">--</span></p>
    <p>Speed: <span class="value" id="speed">--</span> km/h</p>
    <p>Accuracy: <span class="value" id="accuracy">--</span> m</p>

    <a id="map" href="#" target="_blank" rel="noopener">
      Open location in Google Maps
    </a>
  </div>

<script>
const WORKER_URL =
  "https://phone-gps-relay.ayushkumar3602.workers.dev/gps";

let watchId = null;
let lastSent = 0;
let sending = false;

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function startGPS() {
  if (!navigator.geolocation) {
    setStatus("GPS location is not supported by this browser.");
    return;
  }

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  setStatus("Requesting phone GPS permission...");

  watchId = navigator.geolocation.watchPosition(
    async function(position) {
      const c = position.coords;

      const data = {
        lat: Number(c.latitude.toFixed(6)),
        lon: Number(c.longitude.toFixed(6)),
        speed: Number(
          ((c.speed == null ? 0 : c.speed * 3.6).toFixed(2))
        ),
        accuracy: Number(
          (c.accuracy == null ? 0 : c.accuracy).toFixed(1)
        )
      };

      document.getElementById("lat").textContent =
        data.lat.toFixed(6);

      document.getElementById("lon").textContent =
        data.lon.toFixed(6);

      document.getElementById("speed").textContent =
        data.speed.toFixed(2);

      document.getElementById("accuracy").textContent =
        data.accuracy.toFixed(1);

      document.getElementById("map").href =
        "https://www.google.com/maps?q=" +
        data.lat + "," + data.lon;

      if (Date.now() - lastSent < 2000 || sending) {
        return;
      }

      sending = true;
      setStatus("Sending GPS to Cloudflare...");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "HTTP " + response.status);
        }

        lastSent = Date.now();
        setStatus("GPS sent to Cloudflare successfully.");
      } catch (error) {
        setStatus("Send failed: " + error.message);
      } finally {
        sending = false;
      }
    },

    function(error) {
      setStatus("GPS error: " + error.message);
    },

    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    }
  );
}

function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  setStatus("GPS stopped.");
}
</script>

</body>
</html>
